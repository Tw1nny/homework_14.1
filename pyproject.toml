[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing"

[tool.poetry]
name = "bank-widget"
description = "Bank widget"
authors = ["Your Name <email@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pandas = "^3.0.3"
openpyxl = "^3.1.5"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "venv", "build", "dist"]
ignore = ["E203", "W503"]
[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.1.0,<3.0.0)"
]
